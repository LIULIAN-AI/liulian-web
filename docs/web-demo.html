<!DOCTYPE html>
<!--
  LIULIAN · web-demo · 2026-05-21
  Single-file React-via-Babel implementation of the Claude Design
  handoff (liulian-handoff-claude-design-2026.05.21.zip · README in
  references/). All buttons are wired with mock state — interactions
  produce a toast that explicitly labels them (mock).
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>LIULIAN · web demo</title>
<meta name="viewport" content="width=1440" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://api.fontshare.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link href="https://api.fontshare.com/v2/css?f[]=switzer@200,300,400,500,600,700&display=swap" rel="stylesheet" />

<style>
:root {
  --canvas-warm:#FBFBFA; --canvas-soft:#F7F6F3; --canvas-warmer:#F2F0EA;
  --surface:#FFFFFF; --surface-shade:#FAFAF9;
  --ink:#131313; --ink-strong:#1F1F1F; --ink-soft:#34373B;
  --ink-muted:#666A70; --ink-faint:#94989D; --ink-quiet:#C0C2C5;
  --bern:#E20613; --bern-deep:#B00010; --bern-tint:#FDEBEC; --bern-tint-2:#FAD9DC; --bern-text:#9F2F2D;
  --green:#2E7D43; --green-pale:#E5F0E7; --blue:#1F6C9F; --blue-pale:#E1F1FB;
  --amber:#946400; --amber-pale:#FBF1D9;
  --ocean:#0066B3; --grass:#509A39; --apricot:#E6863A;
  --hairline:#E8E7E2; --hairline-strong:#DEDCD4; --hairline-stronger:#C9C7BF;
  --serif:'Fraunces','Times New Roman',serif;
  --sans:'Switzer','SF Pro Text',system-ui,sans-serif;
  --mono:'JetBrains Mono','SF Mono',ui-monospace,monospace;
  --r-sm:4px; --r-md:10px; --r-lg:14px;
  --ease:cubic-bezier(0.22,1,0.36,1);
  --header-h:38px; --sub-h:34px; --sidebar-w:208px;
}
*,*::before,*::after { box-sizing:border-box; }
html,body { margin:0; background:var(--canvas-warm); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.5; font-feature-settings:"ss01","ss02","kern","cv11"; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
.mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }
.meta { font-family:var(--mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); font-weight:500; }
.meta-strong { color:var(--ink); } .meta-soft { color:var(--ink-muted); }
.hairline { border:1px solid var(--hairline); }
.display { font-family:var(--serif); font-weight:400; font-variation-settings:"opsz" 48; letter-spacing:-0.02em; line-height:1.05; color:var(--ink); }
.display-italic { font-family:var(--serif); font-style:italic; font-weight:400; font-variation-settings:"opsz" 38,"SOFT" 50; color:var(--ink-soft); }
.wonk { font-family:var(--serif); font-variation-settings:"opsz" 96,"WONK" 1; font-weight:500; }
.card { background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-md); }
.card-shade { background:var(--surface-shade); }
.pill { display:inline-flex; align-items:center; gap:6px; padding:2px 8px; border:1px solid var(--hairline-strong); border-radius:9999px; font-family:var(--mono); font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-muted); background:var(--surface); }
.pill.live { color:var(--bern); border-color:var(--bern-tint-2); background:var(--bern-tint); }
.pill.dim { color:var(--ink-faint); }
*::-webkit-scrollbar { width:9px; height:9px; }
*::-webkit-scrollbar-track { background:transparent; }
*::-webkit-scrollbar-thumb { background:var(--hairline-strong); border-radius:9999px; border:2px solid var(--canvas-warm); }
*::-webkit-scrollbar-thumb:hover { background:var(--hairline-stronger); }
::selection { background:var(--bern-tint); color:var(--bern-deep); }
kbd,.kbd { font-family:var(--mono); font-size:10px; letter-spacing:0.04em; color:var(--ink-muted); border:1px solid var(--hairline-strong); border-bottom-width:2px; border-radius:4px; padding:1px 5px; background:var(--canvas-soft); min-width:16px; display:inline-flex; justify-content:center; }
.btn { font-family:var(--sans); font-size:12.5px; font-weight:500; padding:6px 12px; border-radius:6px; border:1px solid var(--hairline-strong); background:var(--surface); color:var(--ink); cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; transition:background 150ms var(--ease),border-color 150ms var(--ease); }
.btn:hover { background:var(--canvas-warmer); }
.btn.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
.btn.primary:hover { background:#000; }
.btn.danger { background:var(--bern); color:#fff; border-color:var(--bern); }
.btn.ghost { background:transparent; border-color:transparent; color:var(--ink-muted); }
.btn.ghost:hover { background:var(--surface-shade); color:var(--ink); }
.btn.sm { font-size:11.5px; padding:4px 8px; }
.ribbon-left { position:relative; }
.ribbon-left::before { content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--bern); }
.div-h { height:1px; background:var(--hairline); }
.div-v { width:1px; background:var(--hairline); align-self:stretch; }
:focus { outline:none; }
:focus-visible { outline:2px solid var(--bern); outline-offset:2px; }

/* Toast for mock actions */
.toast-host { position:fixed; bottom:24px; right:24px; z-index:300; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
.toast { background:var(--ink); color:#fff; padding:10px 14px; border-radius:8px; font-size:12.5px; font-family:var(--sans); box-shadow:0 8px 24px rgba(0,0,0,0.22); display:flex; gap:10px; align-items:center; pointer-events:auto; animation:tin 200ms var(--ease); max-width:380px; }
.toast .tag { font-family:var(--mono); font-size:9px; padding:2px 6px; border-radius:9999px; background:var(--bern); color:#fff; letter-spacing:0.06em; text-transform:uppercase; }
@keyframes tin { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

/* Doorway hero */
.doorway-bg { background:radial-gradient(circle at 25% 30%,var(--bern-tint) 0%,transparent 35%),radial-gradient(circle at 75% 70%,var(--amber-pale) 0%,transparent 40%),var(--canvas-warm); }

/* Sidebar */
.sidebar { background:var(--canvas-soft); border-right:1px solid var(--hairline); height:calc(100vh - var(--header-h)); position:sticky; top:var(--header-h); overflow:auto; padding:18px 0; }
.sidebar .head { padding:0 22px 14px; }
.sidebar .group-label { font-family:var(--mono); font-size:10px; letter-spacing:0.10em; text-transform:uppercase; color:var(--ink-faint); padding:14px 22px 4px; }
.sidebar .nav-item { display:flex; align-items:center; padding:7px 22px; gap:14px; cursor:pointer; font-size:13.5px; color:var(--ink-soft); position:relative; }
.sidebar .nav-item .num { font-family:var(--mono); font-size:10px; color:var(--ink-faint); width:14px; }
.sidebar .nav-item:hover { background:var(--surface-shade); }
.sidebar .nav-item.active { color:var(--ink); font-weight:500; background:var(--surface); }
.sidebar .nav-item.active::before { content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--bern); }
.sidebar .nav-item .arrow { margin-left:auto; color:var(--ink-faint); }
.sidebar .footer { position:absolute; bottom:0; left:0; right:0; padding:14px 22px; border-top:1px solid var(--hairline); font-family:var(--mono); font-size:10px; color:var(--ink-faint); letter-spacing:0.04em; text-transform:uppercase; line-height:1.7; }

/* Running header */
.header { height:var(--header-h); display:flex; align-items:center; padding:0 18px; border-bottom:1px solid var(--hairline); background:var(--canvas-warm); position:sticky; top:0; z-index:50; gap:14px; }
.header .brand { font-family:var(--serif); font-weight:500; font-variation-settings:"opsz" 28; letter-spacing:0.02em; font-size:15px; }
.header .sep { color:var(--ink-quiet); }
.header .breadcrumb { font-family:var(--mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-muted); }
.header .breadcrumb b { color:var(--ink); font-weight:500; }
.header .right { margin-left:auto; display:flex; align-items:center; gap:10px; }
.header .timestamp { font-family:var(--mono); font-size:10.5px; color:var(--ink-soft); }

/* Today */
.today-shell { padding:30px 56px 60px; max-width:1500px; }
.today-h1 { font-size:60px; line-height:1.05; letter-spacing:-0.025em; font-family:var(--serif); font-weight:400; font-variation-settings:"opsz" 96; }
.today-h1 em { font-style:italic; font-variation-settings:"opsz" 84,"SOFT" 50,"WONK" 1; color:var(--ink-soft); }
.today-lead { font-family:var(--serif); font-size:22px; line-height:1.45; color:var(--ink); font-variation-settings:"opsz" 32; max-width:62ch; margin-top:24px; }
.today-lead em { font-style:italic; font-variation-settings:"opsz" 28,"SOFT" 50; color:var(--ink-soft); }
.today-meta { display:flex; gap:12px; align-items:center; font-family:var(--mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); margin:18px 0 8px; }
.today-meta .dot { color:var(--bern); }
.today-aside { margin-top:42px; font-family:var(--serif); font-size:14px; font-style:italic; color:var(--ink-muted); font-variation-settings:"opsz" 18,"SOFT" 50; max-width:62ch; }

.suggest-card { display:flex; gap:12px; align-items:flex-start; padding:14px 16px; cursor:pointer; transition:background 150ms var(--ease); border-radius:var(--r-md); }
.suggest-card:hover { background:var(--canvas-warmer); }
.suggest-card .arrow { color:var(--bern); margin-top:2px; font-family:var(--mono); }
.suggest-card .title { font-weight:500; color:var(--ink); font-size:13.5px; }
.suggest-card .sub { font-family:var(--mono); font-size:10.5px; letter-spacing:0.04em; text-transform:uppercase; color:var(--ink-faint); margin-top:4px; }

.tri-col { display:grid; grid-template-columns:1fr 1fr 1fr; gap:32px; margin-top:54px; padding-top:30px; border-top:1px solid var(--hairline); }
.tri-col .col-h { display:flex; align-items:baseline; gap:14px; margin-bottom:18px; }
.tri-col .col-h .title { font-family:var(--serif); font-style:italic; font-size:20px; color:var(--ink); font-variation-settings:"opsz" 28,"SOFT" 50; }
.tri-col .col-h .count { font-family:var(--mono); font-size:12px; color:var(--ink-faint); }
.tri-col .col-h .badge { margin-left:auto; font-family:var(--mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); }
.list-row { background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-md); padding:11px 14px; margin-bottom:8px; display:flex; align-items:flex-start; gap:10px; cursor:pointer; }
.list-row:hover { background:var(--canvas-warmer); }
.list-row.attn { border-left:2px solid var(--bern); }
.list-row .dot { width:6px; height:6px; border-radius:50%; background:var(--ink-faint); margin-top:8px; }
.list-row .dot.red { background:var(--bern); }
.list-row .body { flex:1; }
.list-row .title { font-size:13.5px; color:var(--ink); }
.list-row .title b { font-weight:500; }
.list-row .sub { font-family:var(--mono); font-size:10.5px; letter-spacing:0.04em; text-transform:uppercase; color:var(--ink-faint); margin-top:3px; }
.list-row .right { font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); margin-top:2px; }

.progress { height:5px; background:var(--canvas-warmer); border-radius:9999px; overflow:hidden; margin-top:8px; }
.progress > i { display:block; height:100%; background:var(--ink); border-radius:9999px; }

/* Page shell (non-Today) */
.page-shell { padding:36px 56px 60px; max-width:1500px; }
.page-h1 { font-family:var(--serif); font-weight:400; font-variation-settings:"opsz" 72; letter-spacing:-0.022em; font-size:46px; line-height:1.05; }
.page-h1 em { font-style:italic; font-variation-settings:"opsz" 60,"SOFT" 50,"WONK" 1; color:var(--ink-soft); }
.page-sub { font-family:var(--serif); font-style:italic; font-size:16px; color:var(--ink-muted); font-variation-settings:"opsz" 24,"SOFT" 50; margin-top:8px; max-width:60ch; }
.page-sections-meta { font-family:var(--mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); margin-top:14px; }

/* Tables */
.tbl { width:100%; border-collapse:collapse; font-size:13px; }
.tbl thead th { font-family:var(--mono); font-size:10.5px; font-weight:500; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); padding:9px 12px; text-align:left; border-bottom:1px solid var(--hairline); background:var(--canvas-soft); }
.tbl tbody td { padding:11px 12px; border-bottom:1px dashed var(--hairline); }
.tbl tbody tr:hover { background:var(--canvas-warmer); }
.tbl .num { font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; }
.tbl .status { font-family:var(--mono); font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; }
.status-running   { color:var(--ocean); }
.status-completed { color:var(--green); }
.status-pending   { color:var(--ink-faint); }
.status-failed    { color:var(--bern); }

/* Project picker */
.modal-scrim { position:fixed; inset:0; background:rgba(15,15,15,0.38); z-index:200; display:flex; align-items:center; justify-content:center; }
.modal { background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-lg); width:680px; max-width:96vw; max-height:84vh; overflow:auto; box-shadow:0 24px 60px rgba(0,0,0,0.18); }
.modal-h { padding:18px 22px; border-bottom:1px solid var(--hairline); display:flex; align-items:baseline; gap:14px; }
.modal-h .ttl { font-family:var(--serif); font-style:italic; font-size:22px; font-variation-settings:"opsz" 28; }

/* Command palette */
.palette-overlay { position:fixed; inset:0; background:rgba(15,15,15,0.32); z-index:210; display:flex; flex-direction:column; align-items:center; padding-top:14vh; }
.palette { width:620px; max-width:96vw; background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-lg); box-shadow:0 30px 60px rgba(0,0,0,0.22); }
.palette input { all:unset; width:100%; padding:18px 22px; font-size:18px; font-family:var(--serif); font-style:italic; color:var(--ink); font-variation-settings:"opsz" 28; border-bottom:1px solid var(--hairline); }
.palette input::placeholder { color:var(--ink-faint); }
.palette ul { list-style:none; margin:0; padding:8px 0; max-height:340px; overflow:auto; }
.palette li { padding:10px 22px; display:flex; gap:14px; cursor:pointer; align-items:center; }
.palette li:hover, .palette li.active { background:var(--surface-shade); }
.palette li .key { font-family:var(--mono); font-size:10px; color:var(--ink-faint); letter-spacing:0.04em; text-transform:uppercase; min-width:42px; }
.palette li .name { flex:1; color:var(--ink); font-size:13.5px; }
.palette li .scope { font-family:var(--mono); font-size:10px; color:var(--ink-faint); letter-spacing:0.04em; text-transform:uppercase; }

/* Agent drawer */
.agent-drawer { position:fixed; top:var(--header-h); right:0; bottom:0; width:420px; background:var(--surface); border-left:1px solid var(--hairline); box-shadow:-12px 0 36px rgba(0,0,0,0.06); z-index:60; display:flex; flex-direction:column; }
.agent-drawer .ah { padding:14px 18px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--hairline); }
.agent-drawer .ah .name { font-family:var(--serif); font-style:italic; font-variation-settings:"opsz" 24,"SOFT" 50; font-size:18px; }
.agent-drawer .messages { flex:1; padding:18px; overflow:auto; display:flex; flex-direction:column; gap:18px; }
.msg-user { background:var(--canvas-warmer); padding:10px 14px; border-radius:14px 14px 4px 14px; align-self:flex-end; max-width:80%; font-size:13.5px; }
.msg-agent { font-size:13.5px; }
.msg-agent .step { font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); letter-spacing:0.04em; text-transform:uppercase; margin-bottom:4px; }
.msg-agent .body { line-height:1.55; color:var(--ink); }
.msg-agent .body sup { color:var(--bern); margin:0 2px; font-family:var(--mono); cursor:pointer; }
.agent-drawer .input-row { padding:12px 14px; border-top:1px solid var(--hairline); display:flex; gap:8px; align-items:center; background:var(--canvas-soft); }
.agent-drawer .input-row input { flex:1; padding:9px 12px; border:1px solid var(--hairline-strong); border-radius:8px; font:inherit; font-size:13px; background:var(--surface); }
.suggested-chips { padding:0 14px 12px; display:flex; flex-wrap:wrap; gap:6px; }
.suggested-chips .chip { font-family:var(--mono); font-size:10.5px; padding:4px 8px; border:1px solid var(--hairline-strong); border-radius:9999px; color:var(--ink-soft); background:var(--surface); cursor:pointer; }
.suggested-chips .chip:hover { background:var(--canvas-warmer); }
</style>

</head>
<body>

<div id="toasts" class="toast-host"></div>

const toastHost = document.getElementById("toasts");
function showToast(msg, isMock = true) {
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = (isMock ? '<span class="tag">mock</span>' : '') + '<span>' + msg + '</span>';
  toastHost.appendChild(el);
  setTimeout(() => { el.style.opacity = 0; el.style.transition = "opacity 240ms"; }, 2200);
  setTimeout(() => el.remove(), 2700);
}
const mock = (label) => () => showToast(label);

function ForecastPage({ onAgent }) {
  const chartRef = React.useRef(null);
  React.useEffect(() => {
    if (!chartRef.current || !window.echarts) return;
    const chart = window.echarts.init(chartRef.current);
    const t = Array.from({length: 60}, (_, i) => "2026-05-" + String(10 + Math.floor(i/24)).padStart(2,"0") + " " + String(i%24).padStart(2,"0") + ":00");
    const obs = Array.from({length: 36}, (_, i) => 400 + Math.sin(i / 6) * 18 + (i / 36) * 20);
    const mean = Array.from({length: 60}, (_, i) => i < 36 ? null : 420 + (i - 36) * 1.4 + Math.sin(i/4) * 6);
    const q05  = mean.map(v => v === null ? null : v - 24 - Math.random() * 8);
    const q95  = mean.map(v => v === null ? null : v + 28 + Math.random() * 8);
    chart.setOption({
      grid: { left: 56, right: 24, top: 26, bottom: 40 },
      textStyle: { fontFamily: "Switzer, system-ui, sans-serif", color: "#131313" },
      xAxis: { type: "category", data: t, axisLine: { lineStyle: { color: "#E8E7E2" }}, axisTick: { show: false }, axisLabel: { color: "#94989D", fontSize: 10, fontFamily: "JetBrains Mono", formatter: v => v.slice(5,10) }},
      yAxis: { type: "value", axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: "#666A70", fontSize: 10.5, fontFamily: "JetBrains Mono" }, splitLine: { lineStyle: { color: "#E8E7E2", type: "dashed" }}, name: "m³/s", nameTextStyle: { color: "#94989D", fontFamily: "JetBrains Mono", fontSize: 10 }},

function AgentDrawer({ open, onClose, page }) {
  if (!open) return null;
  const [input, setInput] = React.useState("");
  const [msgs, setMsgs] = React.useState([
    { who: "user",  body: "show stations that crossed Q95 850 last week" },
    { who: "agent", step: "intent → station_risk_query · 4 tool calls · 1.8 s" },
    { who: "agent", body: <>Two stations exceeded <i>Q95</i> 850 m³/s in the last seven days: <b>rhine-rheinfelden</b><sup>1</sup> (twice, peak 893) and <b>brienzersee</b><sup>2</sup> (once, peak 871). Both sit downstream of basins where precipitation was 18 % above 30-year median this week.<sup>3</sup></> },
  ]);
  const send = () => {
    if (!input.trim()) return;
    const m = input;
    setInput("");
    setMsgs(M => [...M, { who: "user", body: m }, { who: "agent", body: <i style={{color:"var(--ink-faint)"}}>(mock) agent reply will arrive here when the SSE endpoint is wired.</i> }]);
  };
  return (
    <aside className="agent-drawer">

        <span style={{width:8,height:8,borderRadius:"50%",background:"var(--bern)"}}></span>

        </span>
      </div>
      <div className="messages">
        {msgs.map((m, i) => (
          m.who === "user"
            ? <div key={i} className="msg-user">{m.body}</div>
            : <div key={i} className="msg-agent">
                {m.step && <div className="step">{m.step}</div>}
                {m.body && <div className="body">{m.body}</div>}
              </div>
        ))}
      </div>
      <div className="suggested-chips">
        {["compare PatchTST × Chronos-2", "draft the morning brief", "annotate the cold-front window"].map(c => (
          <span key={c} className="chip" onClick={() => setInput(c)}>{c}</span>

    { k: "7", n: "Open Models",     scope: "page", do: () => { nav("models");    onClose(); } },
    { k: "8", n: "Open Library",    scope: "page", do: () => { nav("library");   onClose(); } },
    { k: "a", n: "Open Agent",      scope: "page", do: () => { nav("agent");     onClose(); } },
    { k: ",", n: "Open Settings",   scope: "page", do: () => { nav("settings");  onClose(); } },
    { k: "⌘N", n: "New sweep",       scope: "action", do: () => { mock("new sweep")(); onClose(); } },
    { k: "⌘O", n: "Open run by id",  scope: "action", do: () => { mock("open run by id")(); onClose(); } },
    { k: "⌘D", n: "Diff two runs",   scope: "action", do: () => { mock("diff runs")(); onClose(); } },
  ];
  const filtered = cmds.filter(c => c.n.toLowerCase().includes(q.toLowerCase()));
  return (
    <div className="palette-overlay" onClick={onClose}>
      <div className="palette" onClick={e => e.stopPropagation()}>
        <input autoFocus placeholder="type a command, page, or action…" value={q} onChange={e => setQ(e.target.value)}/>
        <ul>
          {filtered.map(c => (
            <li key={c.n} onClick={c.do}>
              <span className="key"><kbd>{c.k}</kbd></span>
              <span className="name">{c.n}</span>
              <span className="scope">{c.scope}</span>
            </li>
          ))}
          {filtered.length === 0 && <li style={{color:"var(--ink-faint)"}}>no matches</li>}
        </ul>
      </div>
    </div>
  );
}

function GuidesModal({ open, onClose }) {
  if (!open) return null;
  return (
    <div className="modal-scrim" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-h"><span className="ttl">Guides</span><span className="meta meta-soft">·</span><span className="meta">7</span><button className="btn ghost sm" style={{marginLeft:"auto"}} onClick={onClose}>esc ✕</button></div>
        <div style={{padding:"16px 22px"}}>
          {[
            ["1", "First import",   "Drop a CSV, watch the agent annotate the schema."],
            ["2", "Edit a cell",    "Double-click in the data table. Charts re-render at < 200 ms."],
            ["3", "Run a sweep",    "PatchTST × seed grid · 12 trials · keep best."],
            ["4", "Compare models", "Pick two runs. Side-by-side residuals · agent reasons about it."],
            ["5", "Sketch a chart", "Draw a curve on canvas. Agent translates to a chart spec."],
            ["6", "Draft a report", "Pick template. Agent fills sections, you approve."],
            ["7", "Modes A / B / C","Classical / AI-first / Fused. C is the headline."],
          ].map(([n, t, d]) => (
            <div key={n} style={{display:"grid",gridTemplateColumns:"32px 1fr",gap:14,padding:"10px 0",borderBottom:"1px dashed var(--hairline)"}}>
              <span className="mono" style={{color:"var(--ink-faint)"}}>{n}</span>
              <div>
                <div style={{fontWeight:500,fontSize:14}}>{t}</div>
                <div className="meta" style={{marginTop:3}}>{d}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ============================================================
// APP
// ============================================================
function App() {
  const [entered, setEntered] = React.useState(false);
  const [page, setPage]       = React.useState("today");
  const [project, setProject] = React.useState("aare-hydro");
  const [agentOpen, setAgentOpen]     = React.useState(false);
  const [paletteOpen, setPaletteOpen] = React.useState(false);
  const [guidesOpen, setGuidesOpen]   = React.useState(false);
  const [sidebarCollapsed, setSidebarCollapsed] = React.useState(false);
  const active = NAV.find(n => n.id === page) || NAV[0];
  const projObj = PROJECTS.find(p => p.id === project);

  // Global keyboard
  React.useEffect(() => {
    const onKey = (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      const meta = e.metaKey || e.ctrlKey;
      if (meta && e.key.toLowerCase() === "k") { e.preventDefault(); setPaletteOpen(o => !o); return; }
      if (meta && e.key === "\\")              { e.preventDefault(); setSidebarCollapsed(c => !c); return; }
      if (e.key === "Escape") { setPaletteOpen(false); setGuidesOpen(false); return; }
      if (e.key === "?")      { setGuidesOpen(o => !o); return; }
      if (!entered) return;
      if (e.key.toLowerCase() === "b" && !meta) { setAgentOpen(o => !o); return; }
      const KEY_MAP = { "0":"today", "1":"live", "2":"data", "3":"visualize", "4":"train", "5":"predict", "6":"reports", "7":"models", "8":"library", "a":"agent", ",":"settings" };
      if (KEY_MAP[e.key]) setPage(KEY_MAP[e.key]);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [entered]);

  const handleDoorwayPick = (id) => {
    if (id === "try-demo")    { setEntered(true); setPage("live");  }
    else if (id === "open-recent") { setEntered(true); setPage("today"); }
    else if (id === "create-project") { setEntered(true); setPage("data"); showToast("(mock) project setup wizard — using aare-hydro for now"); }
    else if (id === "one-shot") { setEntered(true); setPage("data"); showToast("(mock) one-shot import → would drop you on Visualize"); }
  };
  const handleChat = (text) => {
    setEntered(true);
    const t = (text || "").toLowerCase();
    if (/csv|drop|upload|import/.test(t))   { setPage("data");      }
    else if (/train|sweep|fork/.test(t))    { setPage("train");     }
    else if (/compare/.test(t))             { setPage("train"); setAgentOpen(true); }
    else if (/sketch|chart|visual/.test(t)) { setPage("visualize"); }
    else if (/alert|anomaly/.test(t))       { setPage("live");      }
    else                                    { setPage("today");     setAgentOpen(true); }
  };

  if (!entered) {
    return (
      <>
        <Doorway onPick={handleDoorwayPick} onChat={handleChat}/>
        <CommandPalette open={paletteOpen} onClose={() => setPaletteOpen(false)} nav={(p) => { setEntered(true); setPage(p); }} />
        <GuidesModal    open={guidesOpen}  onClose={() => setGuidesOpen(false)} />
      </>
    );
  }

  return (
    <>
      <RunningHeader
        page={active}
        project={projObj}
        sidebarCollapsed={sidebarCollapsed}
        toggleSidebar={() => setSidebarCollapsed(c => !c)}
        onPalette={() => setPaletteOpen(true)}
        onAgent={() => setAgentOpen(o => !o)}
        onGuides={() => setGuidesOpen(true)}
        onBackHome={() => setEntered(false)}
      />
      <div style={{display:"grid",gridTemplateColumns: (sidebarCollapsed ? "44px" : "var(--sidebar-w)") + " 1fr",minHeight:`calc(100vh - var(--header-h))`,transition:"grid-template-columns 220ms var(--ease)"}}>
        <Sidebar page={page} setPage={setPage} collapsed={sidebarCollapsed} />
        <main style={{overflowX:"hidden",minWidth:0}}>
          {page === "today"     && <TodayPage     onAgent={() => setAgentOpen(true)} nav={setPage} />}
          {page === "live"      && <ForecastPage  onAgent={() => setAgentOpen(true)} />}
          {page === "data"      && <DataPage      onAgent={() => setAgentOpen(true)} nav={setPage} />}
          {page === "visualize" && <VisualizePage />}
          {page === "train"     && <TrainPage     />}
          {page === "models"    && <ModelsPage    />}
          {page === "library"   && <LibraryPage   />}
          {page === "predict"   && <InferencePage />}
          {page === "reports"   && <ReportsPage   />}
          {page === "agent"     && <AgentPage     onAgent={() => setAgentOpen(true)} />}
          {page === "settings"  && <SettingsPage  />}
        </main>
      </div>
      <AgentDrawer    open={agentOpen}   onClose={() => setAgentOpen(false)} page={active.label} />
      <CommandPalette open={paletteOpen} onClose={() => setPaletteOpen(false)} nav={setPage} />
      <GuidesModal    open={guidesOpen}  onClose={() => setGuidesOpen(false)} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
</body>
</html>
