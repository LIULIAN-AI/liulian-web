<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LIULIAN · ML Platform</title>
  <meta name="viewport" content="width=1440" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@200,300,400,500,600,700&display=swap" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>

  <style>
    :root {
      /* canvas */
      --canvas-warm:    #FBFBFA;
      --canvas-soft:    #F7F6F3;
      --canvas-warmer:  #F2F0EA;
      --surface:        #FFFFFF;
      --surface-shade:  #FAFAF9;

      /* ink */
      --ink:            #131313;
      --ink-strong:     #1F1F1F;
      --ink-soft:       #34373B;
      --ink-muted:      #666A70;
      --ink-faint:      #94989D;
      --ink-quiet:      #C0C2C5;

      /* brand */
      --bern:           #E20613;
      --bern-deep:      #B00010;
      --bern-tint:      #FDEBEC;
      --bern-tint-2:    #FAD9DC;
      --bern-text:      #9F2F2D;

      /* status (chart only — UI uses typography) */
      --green:      #2E7D43;
      --green-pale: #E5F0E7;
      --blue:       #1F6C9F;
      --blue-pale:  #E1F1FB;
      --amber:      #946400;
      --amber-pale: #FBF1D9;

      /* secondary chart palette (UniBe) */
      --ocean:   #0066B3;
      --grass:   #509A39;
      --apricot: #E6863A;

      /* hairlines */
      --hairline:        #E8E7E2;
      --hairline-strong: #DEDCD4;
      --hairline-stronger:#C9C7BF;

      /* type */
      --serif: 'Fraunces', 'Times New Roman', serif;
      --sans:  'Switzer', 'SF Pro Text', system-ui, sans-serif;
      --mono:  'JetBrains Mono', 'SF Mono', ui-monospace, monospace;

      /* radii */
      --r-sm: 4px;
      --r-md: 10px;
      --r-lg: 14px;

      /* motion */
      --ease: cubic-bezier(0.22, 1, 0.36, 1);

      /* layout */
      --header-h: 38px;
      --sub-h:    34px;
      --sidebar-w: 208px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--canvas-warm);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
      font-feature-settings: "ss01", "ss02", "kern", "cv11";
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* shared atoms ---------------------------------------------------- */

    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .meta {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-faint);
      font-weight: 500;
    }
    .meta-strong { color: var(--ink); }
    .meta-soft   { color: var(--ink-muted); }

    .hairline { border: 1px solid var(--hairline); }

    .display {
      font-family: var(--serif);
      font-weight: 400;
      font-variation-settings: "opsz" 48;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--ink);
    }
    .display-italic {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 400;
      font-variation-settings: "opsz" 38, "SOFT" 50;
      color: var(--ink-soft);
    }
    .wonk {
      font-family: var(--serif);
      font-variation-settings: "opsz" 96, "WONK" 1;
      font-weight: 500;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
    }
    .card-shade { background: var(--surface-shade); }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border: 1px solid var(--hairline-strong);
      border-radius: 9999px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-muted);
      background: var(--surface);
    }
    .pill.live  { color: var(--bern); border-color: var(--bern-tint-2); background: var(--bern-tint); }
    .pill.dim   { color: var(--ink-faint); }

    /* scrollbars (slim, paper-toned) */
    *::-webkit-scrollbar { width: 9px; height: 9px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: var(--hairline-strong); border-radius: 9999px; border: 2px solid var(--canvas-warm); }
    *::-webkit-scrollbar-thumb:hover { background: var(--hairline-stronger); }

    /* selection */
    ::selection { background: var(--bern-tint); color: var(--bern-deep); }

    /* keyboard pills */
    kbd, .kbd {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      color: var(--ink-muted);
      border: 1px solid var(--hairline-strong);
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 1px 5px;
      background: var(--canvas-soft);
      min-width: 16px;
      display: inline-flex;
      justify-content: center;
    }

    /* buttons */
    .btn {
      font-family: var(--sans);
      font-size: 12.5px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--hairline-strong);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 150ms var(--ease), border-color 150ms var(--ease);
    }
    .btn:hover { background: var(--canvas-warmer); }
    .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
    .btn.primary:hover { background: #000; }
    .btn.danger  { background: var(--bern); color: #fff; border-color: var(--bern); }
    .btn.danger:hover { background: var(--bern-deep); border-color: var(--bern-deep); }
    .btn.ghost   { background: transparent; border-color: transparent; color: var(--ink-muted); }
    .btn.ghost:hover { background: var(--surface-shade); color: var(--ink); }
    .btn.sm      { font-size: 11.5px; padding: 4px 8px; }

    /* the bookmark ribbon for active items */
    .ribbon-left {
      position: relative;
    }
    .ribbon-left::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: var(--bern);
    }

    /* loader: tiny rose curve in CSS */
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* layout root */
    #root { min-height: 100vh; }

    /* utility: hairline divider */
    .div-h { height: 1px; background: var(--hairline); }
    .div-v { width: 1px; background: var(--hairline); align-self: stretch; }

    /* hide focus rings except on keyboard */
    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--bern); outline-offset: 2px; }

    /* tab content fade-in */
    /* tab content fade-in — disabled to allow rasterization */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .page-enter { opacity: 1; }
  </style>
</head>
<body>
  <div id="root"></div>
